[project]
name = "tinyruns"
version = "0.1.0.dev0"
description = "Run directories for experiments, and a command that runs them on a Slurm cluster in Apptainer."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
exp = "tinyruns.cluster.main:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "torch>=2.15.0",
]
